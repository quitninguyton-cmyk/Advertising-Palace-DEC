
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertising Palace | Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1>Advertising Palace</h1>
      <p>Admin Control Panel</p>
      <a href="index.html">← Back to Website</a>
    </div>
  </header>

  <main class="container">

    <section id="loginSection" class="section">
      <h2>Admin Login</h2>
      <p>Sign in with your authorized administrator account.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="Admin email">

        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Password">

        <button type="submit">Sign In</button>
        <p id="loginMessage" role="status"></p>
      </form>
    </section>

    <section id="adminDashboard" class="section" hidden>
      <h2>Welcome, Admin!</h2>
      <p>You are signed in to the admin panel.</p>
      <button id="logoutButton" type="button">Log Out</button>

      <hr>

      <h2>Pending Advertisements</h2>
      <div id="pendingAds">
        Loading advertisements...
      </div>

      <hr>

      <h2>Applications</h2>
      <div id="applicationsList">
        Loading applications...
      </div>

      <hr>

      <h2>Post an Announcement</h2>
      <form id="announcementForm">
        <label for="announcementTitle">Announcement Title</label>
        <input id="announcementTitle" type="text" required>

        <label for="announcementMessage">Announcement Message</label>
        <textarea id="announcementMessage" required></textarea>

        <button type="submit">Publish Announcement</button>
        <p id="announcementStatus" role="status"></p>
      </form>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>

</body>
</html>
